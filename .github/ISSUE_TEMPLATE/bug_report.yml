name: Bug report
description: Report a reproducible problem with Agent HTML Render.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not paste active review URLs, session files, tokens, or private artifact content.
  - type: input
    id: version
    attributes:
      label: Agent HTML Render version
      placeholder: Output of agent-html-render --version
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: Node 24, Ubuntu 24.04, Codex CLI
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: List the shortest safe steps that reproduce the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I removed review URLs, access tokens, session files, and sensitive artifact content.
          required: true
