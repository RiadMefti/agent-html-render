<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <title>Agent HTML Render Review</title>
    <style>
      html,
      body,
      #root {
        min-height: 100%;
        margin: 0;
        background: #fafafa;
        color: #171717;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      }

      .review-shell-fallback {
        display: grid;
        min-height: 100vh;
        place-content: center;
        gap: 8px;
        padding: 24px;
        text-align: center;
      }

      .review-shell-fallback strong {
        font-size: 13px;
        font-weight: 600;
      }

      .review-shell-fallback span {
        color: #858585;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="review-shell-fallback" role="status">
        <strong>Loading review…</strong>
        <span>If this remains visible, rerun the agent’s review command.</span>
      </div>
    </div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
